<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Journey of Care — PHC MP Banjara</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Sora:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-a:#0B3D3A; --bg-b:#0F5048;
    --gold:#E8A33D; --coral:#F2637B; --rose:#D97BA8; --sky:#5FA8D3;
    --text:#F7F3E8; --muted:#9DC2B8; --line: rgba(247,243,232,0.16);
    --panel: rgba(7,30,28,0.55);
    --act-accent: var(--rose);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{ width:100%; height:100%; overflow:hidden; background:var(--bg-a); font-family:'Sora', sans-serif; color:var(--text); }
  body{
    background:
      radial-gradient(ellipse 120% 80% at 20% -10%, color-mix(in srgb, var(--act-accent) 14%, transparent), transparent 55%),
      radial-gradient(ellipse 100% 70% at 100% 110%, rgba(242,99,123,0.06), transparent 50%),
      linear-gradient(160deg, var(--bg-a), var(--bg-b) 60%, var(--bg-a));
    background-size:200% 200%; animation: drift 46s ease-in-out infinite;
    position:relative; height:100vh; width:100vw; transition: background 1.4s ease;
  }
  @keyframes drift{ 0%,100%{background-position:0% 0%;} 50%{background-position:100% 100%;} }

  .particles{position:fixed; inset:0; pointer-events:none; z-index:1;}
  .particle{ position:absolute; border-radius:50%; filter: blur(1px); animation: float linear infinite;
    background: radial-gradient(circle, color-mix(in srgb, var(--act-accent) 55%, transparent), transparent 70%); }
  @keyframes float{ 0%{transform:translateY(0) translateX(0); opacity:0;} 10%{opacity:1;} 90%{opacity:1;} 100%{transform:translateY(-110vh) translateX(30px); opacity:0;} }

  #loading{ position:fixed; inset:0; z-index:50; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:22px; background:var(--bg-a); }
  #loading .mark{ font-family:'Fraunces', serif; font-weight:600; font-size:clamp(26px,3.6vw,42px); text-align:center; max-width:80vw; }
  #loading .sub{ color:var(--muted); font-size:15px; letter-spacing:0.04em; text-transform:uppercase; }
  .pulse-dot{ width:10px; height:10px; border-radius:50%; background:var(--gold); animation:pulse 1.3s ease-in-out infinite; }
  @keyframes pulse{ 0%,100%{transform:scale(1); opacity:1;} 50%{transform:scale(1.8); opacity:0.4;} }

  #stage{ position:relative; z-index:2; width:100vw; height:100vh; display:flex; flex-direction:column; opacity:0; transition:opacity 1s ease; }
  #stage.ready{opacity:1;}

  header.top{ display:flex; align-items:center; justify-content:space-between; padding: clamp(14px,2.4vh,26px) clamp(24px,5vw,64px) 0; }
  .brand{ display:flex; flex-direction:column; gap:2px; }
  .brand .eyebrow{ font-family:'JetBrains Mono', monospace; font-size:11px; letter-spacing:0.18em; color:var(--act-accent); text-transform:uppercase; transition:color 0.8s ease; }
  .brand .name{ font-family:'Fraunces', serif; font-weight:600; font-size:clamp(17px,2vw,22px); }
  .clock{ font-family:'JetBrains Mono', monospace; color:var(--muted); font-size:13px; text-align:right; }

  .act-strip{ display:flex; gap:28px; padding: 10px clamp(24px,5vw,64px) 0; align-items:center; }
  .act-chip{ display:flex; align-items:center; gap:8px; font-family:'JetBrains Mono', monospace; font-size:11px;
    letter-spacing:0.1em; text-transform:uppercase; color:var(--muted); opacity:0.5; transition: all 0.5s ease; }
  .act-chip .num{ width:20px; height:20px; border-radius:50%; border:1px solid var(--muted); display:flex; align-items:center; justify-content:center; font-size:10px; }
  .act-chip.active{ opacity:1; color:var(--text); }
  .act-chip.active .num{ background:var(--act-accent); border-color:var(--act-accent); color:#0B1F1C; }
  .act-chip.done{ opacity:0.75; color:var(--act-accent); }

  main.slideshow{ flex:1; display:flex; align-items:center; justify-content:center; position:relative; padding: 0 clamp(24px,6vw,90px); }

  .slide{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; opacity:0; pointer-events:none;
    transform: scale(0.97); transition: opacity 1.1s cubic-bezier(.4,0,.2,1), transform 1.3s cubic-bezier(.4,0,.2,1); }
  .slide.active{ opacity:1; pointer-events:auto; transform:scale(1); }
  .slide-inner{ display:grid; grid-template-columns: 0.9fr 1.1fr; gap: clamp(28px,5vw,80px); align-items:center; max-width:1400px; width:100%; }
  @media (max-aspect-ratio: 1/1){ .slide-inner{ grid-template-columns:1fr; text-align:center; } }

  .stage-block .eyebrow{ font-family:'JetBrains Mono', monospace; color:var(--act-accent); font-size:13px; letter-spacing:0.16em; text-transform:uppercase; transition:color 0.8s ease; }
  .stage-block .headline{ font-family:'Fraunces', serif; font-weight:700; font-size: clamp(36px, 5.4vw, 78px); line-height:1.0; margin: 6px 0 14px;
    background: linear-gradient(120deg, var(--text) 40%, var(--act-accent)); -webkit-background-clip:text; background-clip:text; transition: background 0.8s ease; }
  .stage-block .why{ font-size: clamp(15px,1.5vw,19px); color:var(--muted); max-width:48ch; line-height:1.6; }

  .vax-list{ display:flex; flex-direction:column; gap:11px; }
  .vax-item{ display:flex; align-items:baseline; gap:16px; padding: 13px 20px; border:1px solid var(--line);
    border-left: 3px solid var(--act-accent); border-radius: 6px; background: var(--panel); backdrop-filter: blur(6px);
    opacity:0; transform: translateX(18px); animation: reveal 0.7s ease forwards; transition: border-color 0.8s ease; }
  .vax-item .code{ font-family:'JetBrains Mono', monospace; font-size:12px; color:var(--act-accent); min-width:58px; transition:color 0.8s ease; }
  .vax-item .full{ font-size: clamp(15px,1.5vw,18px); font-weight:500; }
  @keyframes reveal{ to{ opacity:1; transform:translateX(0);} }

  .narration{ margin-top:18px; font-size: clamp(14px,1.3vw,16px); color:var(--text); opacity:0.92; line-height:1.6; max-width:60ch;
    border-top:1px solid var(--line); padding-top:14px; }
  .narration .tag{ font-family:'JetBrains Mono', monospace; font-size:10px; letter-spacing:0.14em; color:var(--act-accent); text-transform:uppercase; display:block; margin-bottom:6px; transition:color 0.8s ease; }

  .journey{ position:relative; z-index:2; padding: 0 clamp(24px,5vw,64px) clamp(14px,2.4vh,24px); }
  .journey svg{ width:100%; height:56px; display:block; }
  .journey .track{ fill:none; stroke:var(--line); stroke-width:2; }
  .journey .progress{ fill:none; stroke:var(--act-accent); stroke-width:2; transition: stroke-dashoffset 0.6s ease, stroke 0.8s ease; }
  .stop-label{ font-family:'JetBrains Mono', monospace; font-size:9px; fill:var(--muted); text-transform:uppercase; letter-spacing:0.04em; }
  .stop-label.done{ fill:var(--act-accent); }
  .stop-dot{ fill:var(--bg-a); stroke:var(--muted); stroke-width:2; }
  .stop-dot.done{ fill:var(--act-accent); stroke:var(--act-accent); }
  .stop-dot.current{ fill:var(--coral); stroke:var(--coral); }

  .controls{ position:fixed; bottom:22px; right:26px; z-index:10; display:flex; gap:10px; align-items:center; }
  .ctrl-btn{ width:44px; height:44px; border-radius:50%; border:1px solid var(--line); background:var(--panel); color:var(--text);
    display:flex; align-items:center; justify-content:center; cursor:pointer; backdrop-filter:blur(6px); font-size:16px; transition: background 0.2s, transform 0.2s; }
  .ctrl-btn:hover{ background:rgba(232,163,61,0.18); transform:scale(1.06); }
  .ctrl-btn.active{ border-color:var(--act-accent); color:var(--act-accent); }

  .ask-panel{ position:fixed; bottom:22px; left:26px; z-index:10; max-width: min(420px, 40vw); }
  .ask-toggle{ font-family:'JetBrains Mono', monospace; font-size:11px; letter-spacing:0.1em; text-transform:uppercase; color:var(--muted);
    background:var(--panel); border:1px solid var(--line); border-radius:20px; padding:9px 16px; cursor:pointer; backdrop-filter:blur(6px); }
  .ask-box{ display:none; margin-top:10px; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px; backdrop-filter:blur(8px); }
  .ask-box.open{ display:block; }
  .ask-box input{ width:100%; padding:10px 12px; border-radius:6px; border:1px solid var(--line); background:rgba(0,0,0,0.2); color:var(--text);
    font-family:'Sora',sans-serif; font-size:14px; outline:none; }
  .ask-box input:focus{ border-color:var(--act-accent); }
  .ask-answer{ margin-top:10px; font-size:13px; color:var(--muted); line-height:1.55; min-height:18px; }
  .ask-answer.loading::after{ content:'…'; animation:pulse 1s infinite; }

  @media (prefers-reduced-motion: reduce){ *{animation-duration:0.01ms !important; animation-iteration-count:1 !important; transition-duration:0.01ms !important;} }
</style>
</head>
<body>

<div class="particles" id="particles"></div>

<div id="loading">
  <div class="mark">A Journey of Care<br>Conception to Five Years</div>
  <div class="sub" id="loading-sub">Preparing AI narration…</div>
  <div class="pulse-dot"></div>
</div>

<div id="stage">
  <header class="top">
    <div class="brand">
      <span class="eyebrow" id="brand-eyebrow">PHC MP Banjara · NHM Telangana</span>
      <span class="name">A Journey of Care</span>
    </div>
    <div class="clock" id="clock"></div>
  </header>

  <div class="act-strip" id="act-strip"></div>

  <main class="slideshow" id="slideshow"></main>

  <div class="journey">
    <svg viewBox="0 0 1400 60" preserveAspectRatio="none" id="journey-svg">
      <path class="track" id="track-path" d="M20,30 L1380,30"></path>
      <path class="progress" id="progress-path" d="M20,30 L1380,30"></path>
      <g id="stops"></g>
    </svg>
  </div>
</div>

<div class="controls">
  <button class="ctrl-btn active" id="btn-sound" title="Toggle narration">🔊</button>
  <button class="ctrl-btn" id="btn-play" title="Pause / play">⏸</button>
</div>

<div class="ask-panel">
  <button class="ask-toggle" id="ask-toggle">Ask about this stage</button>
  <div class="ask-box" id="ask-box">
    <input type="text" id="ask-input" placeholder="e.g. What happens at the 2nd ANC visit?">
    <div class="ask-answer" id="ask-answer"></div>
  </div>
</div>

<script>
/* ---------- Journey data: Conception -> ANC -> Delivery -> Child immunization to 5 years ---------- */
const ACTS = [
  { name: "Expecting", accent: "#D97BA8" },
  { name: "Arrival", accent: "#E8A33D" },
  { name: "Growing Strong", accent: "#5FA8D3" },
];

const SCHEDULE = [
  { act:0, age:"Conception", eyebrow:"Stop 1",
    why:"The journey begins. Early registration at the PHC or sub-centre lets ASHA and ANM workers start care from week one.",
    vaccines:[ {code:"Reg", full:"Pregnancy registration — as soon as pregnancy is suspected", booster:false} ] },
  { act:0, age:"ANC Visit 1 (by 12 wks)", eyebrow:"Stop 2",
    why:"The first checkup confirms the pregnancy is progressing well and screens for early risks.",
    vaccines:[
      {code:"Reg+", full:"Weight, BP, Hb, blood group & urine test", booster:false},
      {code:"Td-1", full:"Td-1 (Tetanus-diphtheria) injection", booster:false},
      {code:"IFA", full:"Iron & Folic Acid tablets started", booster:false},
      {code:"USG", full:"Early ultrasound scan", booster:false},
    ] },
  { act:0, age:"ANC Visit 2 (14–26 wks)", eyebrow:"Stop 3",
    why:"Mid-pregnancy checks track the baby's growth and the mother's nutrition and sugar levels.",
    vaccines:[
      {code:"Td-2", full:"Td-2 injection", booster:false},
      {code:"Anomaly", full:"Anomaly scan (18–20 weeks)", booster:false},
      {code:"GDM", full:"Blood sugar screening", booster:false},
      {code:"IFA", full:"Continued Iron & Folic Acid, calcium", booster:false},
    ] },
  { act:0, age:"ANC Visit 3 (28–34 wks)", eyebrow:"Stop 4",
    why:"As the due date nears, checks focus on the baby's position, growth and the mother's haemoglobin.",
    vaccines:[
      {code:"Hb", full:"Haemoglobin recheck, anaemia correction if needed", booster:false},
      {code:"Growth", full:"Foetal growth & position check", booster:false},
      {code:"BP+", full:"Danger-sign counselling (BP, swelling, bleeding)", booster:true},
    ] },
  { act:0, age:"ANC Visit 4 (36 wks–delivery)", eyebrow:"Stop 5",
    why:"The final visit prepares the family for a safe, planned, institutional delivery.",
    vaccines:[
      {code:"Plan", full:"Birth preparedness & delivery plan finalised", booster:false},
      {code:"Ref", full:"High-risk referral if needed", booster:true},
    ] },
  { act:1, age:"Delivery", eyebrow:"Stop 6",
    why:"A safe, institutional delivery at the hospital, attended by skilled staff, protects both mother and baby.",
    vaccines:[
      {code:"Del", full:"Institutional delivery under skilled care", booster:false},
      {code:"EBF", full:"Breastfeeding initiated within 1 hour", booster:false},
      {code:"Vit-K", full:"Vitamin K injection for the newborn", booster:false},
    ] },
  { act:1, age:"At Birth", eyebrow:"Stop 7",
    why:"Before leaving the facility, three vaccines begin the child's own immunity journey.",
    vaccines:[
      {code:"BCG", full:"BCG — protects against severe childhood TB", booster:false},
      {code:"OPV-0", full:"OPV-0 — first dose against polio", booster:false},
      {code:"Hep B-0", full:"Hepatitis B (birth dose)", booster:false},
    ] },
  { act:2, age:"6 Weeks", eyebrow:"Stop 8",
    why:"The first full round of childhood vaccines begins as maternal immunity starts to fade.",
    vaccines:[
      {code:"OPV-1", full:"OPV-1 — polio", booster:false},
      {code:"Penta-1", full:"Pentavalent-1 — DPT, Hep B, Hib", booster:false},
      {code:"RVV-1", full:"Rotavirus-1", booster:false},
      {code:"fIPV-1", full:"Fractional IPV-1", booster:false},
      {code:"PCV-1", full:"PCV-1 — pneumococcal disease", booster:false},
    ] },
  { act:2, age:"10 Weeks", eyebrow:"Stop 9",
    why:"The second round builds on the protection started at six weeks.",
    vaccines:[
      {code:"OPV-2", full:"OPV-2", booster:false},
      {code:"Penta-2", full:"Pentavalent-2", booster:false},
      {code:"RVV-2", full:"Rotavirus-2", booster:false},
      {code:"PCV-2", full:"PCV-2", booster:false},
    ] },
  { act:2, age:"14 Weeks", eyebrow:"Stop 10",
    why:"The primary vaccine series is completed, giving core protection before the first year.",
    vaccines:[
      {code:"OPV-3", full:"OPV-3", booster:false},
      {code:"Penta-3", full:"Pentavalent-3", booster:false},
      {code:"RVV-3", full:"Rotavirus-3", booster:false},
      {code:"fIPV-2", full:"Fractional IPV-2", booster:false},
      {code:"PCV-3", full:"PCV-3", booster:false},
    ] },
  { act:2, age:"9–12 Months", eyebrow:"Stop 11",
    why:"As the child explores the world more, protection extends to measles and, in endemic areas, encephalitis.",
    vaccines:[
      {code:"MR-1", full:"Measles-Rubella-1", booster:false},
      {code:"JE-1*", full:"Japanese Encephalitis-1 (endemic districts)", booster:false},
      {code:"PCV-B", full:"PCV Booster", booster:true},
      {code:"Vit-A", full:"Vitamin A — 1st dose", booster:false},
    ] },
  { act:2, age:"16–24 Months", eyebrow:"Stop 12",
    why:"Booster doses lock in long-term immunity through the toddler years.",
    vaccines:[
      {code:"MR-2", full:"Measles-Rubella-2", booster:true},
      {code:"JE-2*", full:"Japanese Encephalitis-2 (endemic districts)", booster:true},
      {code:"DPT-B1", full:"DPT Booster-1", booster:true},
      {code:"OPV-B", full:"OPV Booster", booster:true},
      {code:"Vit-A", full:"Vitamin A — every 6 months till age 5", booster:false},
    ] },
  { act:2, age:"5–6 Years", eyebrow:"Stop 13",
    why:"A booster before school years completes the child's core immunity, five years after the journey began.",
    vaccines:[ {code:"DPT-B2", full:"DPT Booster-2", booster:true} ] },
];

const FALLBACK_NARRATION = [
  "The journey of care begins the moment a pregnancy is suspected. Registering early at the health centre means an ASHA or ANM worker can start guiding the family from week one.",
  "By twelve weeks, the first checkup confirms the pregnancy is healthy, records the mother's baseline health, and starts iron and folic acid tablets.",
  "Between fourteen and twenty-six weeks, an anomaly scan checks the baby's development while a second tetanus-diphtheria dose and continued nutrition support the mother.",
  "As the third trimester begins, checks focus on the baby's growth and position, while the mother's haemoglobin is rechecked to prevent anaemia.",
  "In the final weeks before delivery, the family and health team finalise a safe delivery plan, watching closely for any danger signs.",
  "At the hospital, a safe institutional delivery, immediate breastfeeding, and a Vitamin K injection give the newborn the strongest possible start.",
  "Before leaving the facility, three vaccines begin the baby's own immunity journey — protecting against tuberculosis, polio and hepatitis B from day one.",
  "By six weeks, the first full round of childhood vaccines begins, protecting against the diseases most dangerous in early infancy.",
  "At ten weeks, a second round builds on the protection started earlier, strengthening the baby's growing immunity.",
  "By fourteen weeks, the primary vaccine series is complete — the core shield every child needs is now in place.",
  "Between nine and twelve months, as the baby explores the world more, measles protection begins, along with encephalitis protection in some districts.",
  "Between sixteen and twenty-four months, booster doses lock in everything given so far, carrying protection through the toddler years.",
  "At five to six years, a final booster completes the child's core immunity — five years of care, from the very first checkup to a strong, protected child.",
];

let narration = FALLBACK_NARRATION.slice();
let current = 0;
let playing = true;
let soundOn = true;
let slideTimer = null;
const SLIDE_MS = 12500;
const n = SCHEDULE.length;

async function generateNarration(){
  try{
    const payload = SCHEDULE.map(s => ({ age: s.age, items: s.vaccines.map(v => v.full) }));
    const prompt = `You are writing spoken narration for a looping cinematic video shown on a smart-board TV in the waiting area of a rural Primary Health Centre in Telangana, India. It tells the full story of one family: from conception, through the 4 antenatal checkups, hospital delivery, and the child's immunization schedule up to age 5. Parents and pregnant women watch it passively. For each stage below, write exactly one warm, reassuring, plain-language narration of 2 short sentences (spoken aloud, no jargon, no medical codes), told as a continuous story of care. Return ONLY a valid JSON array of strings, same order, no markdown fences, no extra text.\n\nStages:\n${JSON.stringify(payload, null, 2)}`;
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ model: "claude-sonnet-4-6", max_tokens: 1200, messages: [{ role: "user", content: prompt }] })
    });
    const data = await response.json();
    const textBlock = (data.content || []).find(b => b.type === "text");
    if(!textBlock) throw new Error("no text block");
    const cleaned = textBlock.text.replace(/```json|```/g, "").trim();
    const parsed = JSON.parse(cleaned);
    if(Array.isArray(parsed) && parsed.length === n) narration = parsed;
  }catch(e){ console.warn("AI narration unavailable, using fallback.", e); }
}

/* ---------- Build act strip ---------- */
const actStrip = document.getElementById('act-strip');
ACTS.forEach((a, i) => {
  const chip = document.createElement('div');
  chip.className = 'act-chip';
  chip.dataset.act = i;
  chip.innerHTML = `<span class="num">${i+1}</span><span>${a.name}</span>`;
  actStrip.appendChild(chip);
});

/* ---------- Build slides ---------- */
const slideshow = document.getElementById('slideshow');
SCHEDULE.forEach((stop, i) => {
  const el = document.createElement('div');
  el.className = 'slide'; el.dataset.index = i;
  el.innerHTML = `
    <div class="slide-inner">
      <div class="stage-block">
        <span class="eyebrow">${stop.eyebrow}</span>
        <div class="headline">${stop.age}</div>
        <div class="why">${stop.why}</div>
      </div>
      <div>
        <div class="vax-list">
          ${stop.vaccines.map((v,idx) => `
            <div class="vax-item" style="animation-delay:${idx*0.12}s">
              <span class="code">${v.code}</span><span class="full">${v.full}</span>
            </div>`).join('')}
        </div>
        <div class="narration"><span class="tag">AI narration</span><span class="narration-text"></span></div>
      </div>
    </div>`;
  slideshow.appendChild(el);
});

/* ---------- Journey path ---------- */
const stopsG = document.getElementById('stops');
const svgWidth = 1400, margin = 20, usable = svgWidth - margin*2;
const positions = SCHEDULE.map((_, i) => margin + (usable * i) / (n-1));
positions.forEach((x, i) => {
  const dot = document.createElementNS("http://www.w3.org/2000/svg","circle");
  dot.setAttribute("cx", x); dot.setAttribute("cy", 30); dot.setAttribute("r", 5.5);
  dot.setAttribute("class", "stop-dot"); dot.dataset.index = i;
  stopsG.appendChild(dot);
});
const progressPath = document.getElementById('progress-path');
const totalLen = progressPath.getTotalLength();
progressPath.style.strokeDasharray = totalLen;
progressPath.style.strokeDashoffset = totalLen;

function setAct(actIdx){
  const act = ACTS[actIdx];
  document.documentElement.style.setProperty('--act-accent', act.accent);
  document.querySelectorAll('.act-chip').forEach(chip => {
    const idx = +chip.dataset.act;
    chip.classList.toggle('active', idx === actIdx);
    chip.classList.toggle('done', idx < actIdx);
  });
}

function updateJourney(){
  const frac = current / (n-1);
  progressPath.style.strokeDashoffset = totalLen - (totalLen * frac);
  document.querySelectorAll('.stop-dot').forEach(d => {
    const idx = +d.dataset.index;
    d.classList.toggle('done', idx < current);
    d.classList.toggle('current', idx === current);
  });
  setAct(SCHEDULE[current].act);
}

const slides = document.querySelectorAll('.slide');

function showSlide(i){
  slides.forEach(s => s.classList.remove('active'));
  slides[i].classList.add('active');
  slides[i].querySelector('.narration-text').textContent = narration[i] || FALLBACK_NARRATION[i];
  slides[i].querySelectorAll('.vax-item').forEach(el => { el.style.animation = 'none'; void el.offsetWidth; el.style.animation = null; });
  updateJourney();
  speak(narration[i] || FALLBACK_NARRATION[i]);
}

function next(){ current = (current + 1) % n; showSlide(current); scheduleNext(); }
function scheduleNext(){ clearTimeout(slideTimer); if(playing){ slideTimer = setTimeout(next, SLIDE_MS); } }

function speak(text){
  if(!soundOn || !('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.rate = 0.95; utter.pitch = 1;
  window.speechSynthesis.speak(utter);
}

document.getElementById('btn-play').addEventListener('click', (e) => {
  playing = !playing;
  e.target.textContent = playing ? '⏸' : '▶';
  e.target.classList.toggle('active', playing);
  if(playing){ scheduleNext(); } else { clearTimeout(slideTimer); window.speechSynthesis.cancel(); }
});
document.getElementById('btn-sound').addEventListener('click', (e) => {
  soundOn = !soundOn;
  e.target.classList.toggle('active', soundOn);
  e.target.textContent = soundOn ? '🔊' : '🔇';
  if(!soundOn) window.speechSynthesis.cancel();
});

const askToggle = document.getElementById('ask-toggle');
const askBox = document.getElementById('ask-box');
const askInput = document.getElementById('ask-input');
const askAnswer = document.getElementById('ask-answer');
askToggle.addEventListener('click', () => { askBox.classList.toggle('open'); if(askBox.classList.contains('open')) askInput.focus(); });
askInput.addEventListener('keydown', async (e) => {
  if(e.key !== 'Enter' || !askInput.value.trim()) return;
  const q = askInput.value.trim();
  askAnswer.textContent = ''; askAnswer.classList.add('loading');
  playing = false; clearTimeout(slideTimer);
  try{
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ model: "claude-sonnet-4-6", max_tokens: 300,
        messages: [{ role: "user", content: `A pregnant woman or new parent at a rural Indian Primary Health Centre is watching a display about the pregnancy-to-childhood care journey and asks: "${q}". Answer in 2-3 short, plain-language sentences, warm and reassuring, no jargon. Base it on India's ANC guidelines and Universal Immunization Programme where relevant.` }] })
    });
    const data = await response.json();
    const block = (data.content || []).find(b => b.type === 'text');
    askAnswer.textContent = block ? block.text : "Sorry, couldn't find an answer just now — please ask the PHC staff.";
  }catch(err){ askAnswer.textContent = "Couldn't reach the AI just now — please ask the PHC staff directly."; }
  askAnswer.classList.remove('loading');
});

document.getElementById('stage').addEventListener('click', (e) => {
  if(e.target.closest('.controls') || e.target.closest('.ask-panel')) return;
  document.getElementById('btn-play').click();
});

function tickClock(){
  const now = new Date();
  document.getElementById('clock').textContent = now.toLocaleString('en-IN', { weekday:'short', day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit' });
}
tickClock(); setInterval(tickClock, 30000);

const particleWrap = document.getElementById('particles');
for(let i=0;i<18;i++){
  const p = document.createElement('div'); p.className = 'particle';
  const size = 3 + Math.random()*6;
  p.style.width = size+'px'; p.style.height = size+'px';
  p.style.left = Math.random()*100+'vw'; p.style.bottom = '-10px';
  p.style.animationDuration = (18 + Math.random()*20)+'s';
  p.style.animationDelay = (Math.random()*20)+'s';
  particleWrap.appendChild(p);
}

(async function boot(){
  setAct(0);
  await generateNarration();
  document.getElementById('loading').style.display = 'none';
  document.getElementById('stage').classList.add('ready');
  showSlide(0);
  scheduleNext();
})();
</script>
</body>
</html>
